name: Publish IAM Documentation (manual)

# Manual Pages preparation: build the static documentation site and upload it as
# an Actions artifact. Deployment to GitHub Pages is intentionally NOT enabled by
# this workflow and no GitHub Release is created. A human must enable Pages and
# attach the produced artifact manually as part of the release gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iam-docs/package-lock.json

      - name: Verify documentation workflow configuration
        run: bash scripts/test-docs-workflow.sh

      - name: Install documentation dependencies
        working-directory: iam-docs
        run: npm ci

      - name: Type-check the documentation site
        working-directory: iam-docs
        run: npm run check

      - name: Build the documentation site
        working-directory: iam-docs
        run: npm run build

      - name: Upload static documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: iam-docs-site
          path: iam-docs/dist
          if-no-files-found: error
