name: Publish Muer Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iam-docs/package-lock.json

      - name: Verify documentation workflow configuration
        run: bash scripts/test-docs-workflow.sh

      - name: Install documentation dependencies
        working-directory: iam-docs
        run: npm ci

      - name: Type-check the documentation site
        working-directory: iam-docs
        run: npm run check

      - name: Build the documentation site
        working-directory: iam-docs
        run: npm run build
        env:
          SITE_URL: https://wbh123.github.io/iam/
          BASE_PATH: /iam

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: iam-docs/dist
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
