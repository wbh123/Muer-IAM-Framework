name: Verify Muer Maven Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only build and stage release artifacts; never upload to Central'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CENTRAL_DRY_RUN_USERNAME: dry-run
      CENTRAL_DRY_RUN_PASSWORD: dry-run
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_DRY_RUN_USERNAME
          server-password: CENTRAL_DRY_RUN_PASSWORD

      - name: Verify ordinary build remains credential-free
        run: mvn -B clean verify

      - name: Verify frozen 0.1.0 release version
        run: bash scripts/verify-release-version.sh

      - name: Build and stage Central bundle without publishing
        if: ${{ inputs.dry_run }}
        run: >-
          mvn -B -Pcentral-release,central-publish
          -Dgpg.skip=true
          -Dcentral.skipPublishing=true
          clean deploy

      - name: Verify release artifacts and publication boundary
        if: ${{ inputs.dry_run }}
        run: bash scripts/verify-maven-release-artifacts.sh

      - name: Generate effective POM for release review
        if: ${{ inputs.dry_run }}
        run: >-
          mvn -B -Pcentral-release,central-publish help:effective-pom
          -Dgpg.skip=true
          -Dcentral.skipPublishing=true
          -Doutput=target/effective-pom.xml

      - name: Verify formal release ref
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/release/0.1.0" || {
            echo 'Formal publication must run from release/0.1.0.' >&2
            exit 1
          }
          tag_sha="$(git rev-list -n 1 v0.1.0 2>/dev/null || true)"
          test -n "$tag_sha" || {
            echo 'Tag v0.1.0 must exist before formal publication.' >&2
            exit 1
          }
          test "$tag_sha" = "$GITHUB_SHA" || {
            echo "Tag v0.1.0 points to $tag_sha, but workflow SHA is $GITHUB_SHA." >&2
            exit 1
          }

      - name: Configure Maven Central credentials
        if: ${{ !inputs.dry_run }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD

      - name: Import release signing key
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MAVEN_GPG_PRIVATE_KEY" || { echo 'MAVEN_GPG_PRIVATE_KEY is required.' >&2; exit 1; }
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Publish the approved release to Central
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$MAVEN_CENTRAL_USERNAME" || { echo 'MAVEN_CENTRAL_USERNAME is required.' >&2; exit 1; }
          test -n "$MAVEN_CENTRAL_PASSWORD" || { echo 'MAVEN_CENTRAL_PASSWORD is required.' >&2; exit 1; }
          test -n "$MAVEN_GPG_PASSPHRASE" || { echo 'MAVEN_GPG_PASSPHRASE is required.' >&2; exit 1; }
          mvn -B -Pcentral-release,central-publish deploy -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE"
