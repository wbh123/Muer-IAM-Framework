name: Verify Muer Admin Console

on:
  push:
    branches: [main, feature/iam-admin-console, feature/**, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/muer-admin-console/package-lock.json

      # openapi-generator-cli needs a JVM to turn iam.yaml into the TS client.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/muer-admin-console

      - name: Generate TypeScript client from OpenAPI contract
        run: npm run api:generate
        working-directory: apps/muer-admin-console

      - name: Type check
        run: npm run type-check
        working-directory: apps/muer-admin-console

      - name: Test
        run: npm test
        working-directory: apps/muer-admin-console

      - name: Build
        run: npm run build
        working-directory: apps/muer-admin-console
