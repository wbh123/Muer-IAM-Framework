name: Verify Muer Starter

on:
  push:
    branches: [main, develop/**, feature/**, codex/**, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify ordinary CI workflow hygiene
        run: bash scripts/test-ci-workflows.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify project identity
        shell: pwsh
        run: |
          $forbiddenTokens = @(
            ([char[]](99,111,109,46,119,117,115,116,46,105,97,109) -join ''),
            ([char[]](99,111,109,46,119,117,115,116) -join ''),
            ([char[]](87,117,115,116) -join ''),
            ([char[]](0x6B66,0x6C49,0x79D1,0x6280,0x5927,0x5B66) -join '')
          )
          ./scripts/test-identity-check.ps1 -RepositoryRoot $PWD
          ./scripts/verify-no-legacy-identifiers.ps1 -RepositoryRoot $PWD -ForbiddenToken $forbiddenTokens

      - name: Verify Muer project identity
        run: bash scripts/test-muer-identity.sh

      - name: Verify framework Reactor and architecture tests
        run: mvn -B verify

      - name: Test Spring Boot auto-configuration
        run: >-
          mvn -B -pl modules/muer-spring-boot-autoconfigure -am
          -Dtest=MuerAutoConfigurationTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Install framework modules for standalone consumers
        run: mvn -B install -DskipTests

      - name: Smoke test the Quick Start consumer application
        run: mvn -B -f examples/quickstart/pom.xml test

      - name: Smoke test the Showcase consumer application
        run: >-
          mvn -B -f examples/showcase/pom.xml
          -Dtest=IamStarterAutoConfigurationSmokeTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Verify consumer showcase documentation
        run: bash scripts/test-showcase-readme.sh

      - name: Package the consumable Starter
        run: mvn -B -pl modules/muer-spring-boot-starter -am package -DskipTests

      - name: Verify dependency-only Starter release Javadoc artifact
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -pl modules/muer-spring-boot-starter -am \
            -Pcentral-release \
            -Dgpg.skip=true \
            -DskipTests \
            package
          javadoc_jar="$(find modules/muer-spring-boot-starter/target -maxdepth 1 -type f \
            -name 'muer-spring-boot-starter-*-javadoc.jar' -print -quit)"
          test -n "$javadoc_jar"
          jar tf "$javadoc_jar" | grep -Fxq 'README.md'

  management-verify:
    name: Verify Muer Management API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test management module and its domain dependencies
        run: mvn -B -pl modules/muer-http-api -am test

  showcase-integration:
    name: Docker/Testcontainers consumer showcase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Docker availability
        run: docker info

      - name: Install framework modules for the Showcase consumer
        run: mvn -B install -DskipTests

      - name: Run MySQL and Redis consumer walkthrough and seeder isolation checks
        run: mvn -B -f examples/showcase/pom.xml -Pintegration test

  consumer-integration:
    name: Independent Consumer acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Docker availability
        run: docker info

      - name: Enforce Consumer public API boundary
        run: bash scripts/verify-consumer-public-api.sh test-apps/consumer-acceptance/src/main/java

      - name: Install framework modules for the independent Consumer
        run: mvn -B install -DskipTests

      - name: Run independent Consumer acceptance
        run: mvn -B -f test-apps/consumer-acceptance/pom.xml verify

  release-bundle:
    name: Maven Central RC bundle dry-run
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    env:
      CENTRAL_DRY_RUN_USERNAME: dry-run
      CENTRAL_DRY_RUN_PASSWORD: dry-run
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_DRY_RUN_USERNAME
          server-password: CENTRAL_DRY_RUN_PASSWORD

      - name: Verify release candidate remains SNAPSHOT
        run: bash scripts/verify-release-version.sh

      - name: Build Central bundle without publishing
        run: >-
          mvn -B -Pcentral-release,central-publish
          -Dgpg.skip=true
          -Dcentral.skipPublishing=true
          clean deploy

      - name: Verify release artifacts and publication boundary
        run: bash scripts/verify-maven-release-artifacts.sh

      - name: Generate effective POM for release review
        run: >-
          mvn -B -Pcentral-release,central-publish help:effective-pom
          -Dgpg.skip=true
          -Dcentral.skipPublishing=true
          -Doutput=target/effective-pom.xml
