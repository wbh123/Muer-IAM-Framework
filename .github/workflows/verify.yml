name: Verify IAM Starter

on:
  push:
    branches: [main, develop/**, feature/**, codex/**, release/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify project identity
        shell: pwsh
        run: |
          $forbiddenTokens = @(
            ([char[]](99,111,109,46,119,117,115,116,46,105,97,109) -join ''),
            ([char[]](99,111,109,46,119,117,115,116) -join ''),
            ([char[]](87,117,115,116) -join ''),
            ([char[]](0x6B66,0x6C49,0x79D1,0x6280,0x5927) -join '')
          )
          ./scripts/test-identity-check.ps1 -RepositoryRoot $PWD
          ./scripts/test-rename-project.ps1 -RepositoryRoot $PWD
          ./scripts/verify-no-legacy-identifiers.ps1 -RepositoryRoot $PWD -ForbiddenToken $forbiddenTokens

      - name: Test Spring Boot auto-configuration
        run: >-
          mvn -B -pl iam-spring-boot-autoconfigure -am
          -Dtest=IamAutoConfigurationTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Smoke test the starter from a consumer application
        run: >-
          mvn -B -pl iam-example -am
          -Dtest=IamStarterAutoConfigurationSmokeTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Verify consumer showcase documentation
        run: bash scripts/test-showcase-readme.sh

      - name: Package the consumable Starter
        run: mvn -B -pl iam-spring-boot-starter -am package -DskipTests

  management-verify:
    name: Verify IAM Management API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test management module and its domain dependencies
        run: mvn -B -pl iam-management-web -am test

  showcase-integration:
    name: Docker/Testcontainers consumer showcase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Docker availability
        run: docker info

      - name: Run MySQL and Redis consumer walkthrough
        run: >-
          mvn -B -pl iam-example -am -Pintegration
          -Dtest=IamStarterConsumptionTest,IamSecurityIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Verify opt-in admin demo seeder isolation
        run: >-
          mvn -B -pl iam-example -am -Pintegration
          -Dtest=AdminConsoleDemoSeedIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false test

  consumer-integration:
    name: Independent Consumer acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Docker availability
        run: docker info

      - name: Enforce Consumer public API boundary
        run: bash scripts/verify-consumer-public-api.sh

      - name: Run independent Consumer acceptance
        run: >-
          mvn -B -pl iam-example -am -Pintegration
          -Dtest=IamConsumerIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false test
