openapi: 3.0.3
info:
  title: Generic IAM Management API
  version: 0.1.0
servers:
  - url: /
paths:
  /iam/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401': {description: Invalid credentials}
  /iam/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      responses:
        '204': {description: Logged out}
        '401': {description: Authentication required}
  /iam/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentPrincipal
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrincipalResponse'}
        '401': {description: Authentication required}
  /iam/sessions:
    get:
      tags: [Sessions]
      operationId: listMySessions
      parameters:
        - name: userId
          in: query
          required: false
          deprecated: true
          schema: {type: integer, format: int64}
          description: Ignored compatibility parameter; identity always comes from the Bearer principal.
      responses:
        '200':
          description: Active sessions owned by the current principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionListResponse'}
        '401': {description: Authentication required}
  /iam/sessions/{sessionId}/revoke:
    post:
      tags: [Sessions]
      operationId: revokeMySession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevokeRequest'}
      responses:
        '204': {description: Session revoked}
        '401': {description: Authentication required}
        '404': {description: Active session not found for current principal}
  /iam/sessions/revoke-others:
    post:
      tags: [Sessions]
      operationId: revokeOtherSessions
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevokeOthersRequest'}
      responses:
        '204': {description: Other sessions revoked}
        '401': {description: Authentication required}
  /iam/authorization/profiles:
    get:
      tags: [Authorization]
      operationId: listMyAuthorizationProfiles
      responses:
        '200':
          description: Profiles available to the current principal
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AuthorizationProfileResponse'}
  /iam/authorization/profiles/{profileId}/switch:
    post:
      tags: [Authorization]
      operationId: switchAuthorizationProfile
      parameters:
        - name: profileId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: New token with exactly one active profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401':
          description: Authentication required
        '404':
          description: Profile is not available to the current principal
  /iam/authorization/diagnostics:
    post:
      tags: [Authorization]
      operationId: evaluateAuthorization
      description: >
        Authenticated self diagnostics. Any authenticated principal may project
        its OWN runtime authorization decision (read-only, no state change).
        The projection always uses the principal from the security context; no
        userId/profileId/principal may be supplied to diagnose someone else.
        This endpoint does not require any iam.admin.* permission. Unauthenticated
        requests receive 401. (The iam.admin.diagnostics capability only controls
        whether the Admin Console shows its Diagnostics page.)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorizationEvaluationRequest'}
      responses:
        '200':
          description: Projection of the runtime authorization decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationDecisionResponse'}
        '401':
          description: Authentication required
  /iam/admin/templates/{versionId}:
    put:
      tags: [Administration]
      operationId: savePermissionTemplateVersion
      parameters:
        - name: versionId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PermissionTemplateVersionRequest'}
      responses:
        '204': {description: Template version saved}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
  /iam/admin/users:
    get:
      tags: [Administration]
      operationId: listUsers
      parameters:
        - name: afterUserId
          in: query
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: username
          in: query
          required: false
          schema: {type: string, maxLength: 191}
          description: Optional case-insensitive substring filter on username.
        - name: userType
          in: query
          required: false
          schema: {type: string, maxLength: 64}
          description: Optional exact filter on user type.
        - name: enabled
          in: query
          required: false
          schema: {type: boolean}
          description: Optional filter on account enabled state.
      responses:
        '200':
          description: Cursor-paginated users
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserListResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
  /iam/admin/users/{userId}:
    get:
      tags: [Management Users]
      operationId: getUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: User detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: User not found}
    put:
      tags: [Administration]
      operationId: saveUser
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserRequest'}
      responses:
        '204': {description: User saved}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
  /iam/admin/users/{userId}/identities:
    get:
      tags: [Administration]
      operationId: listUserIdentities
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Identities bound to the user
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/IdentityResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
  /iam/admin/identities/{identityId}:
    get:
      tags: [Management Identity]
      operationId: getIdentity
      parameters:
        - name: identityId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Identity detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: Identity not found}
    put:
      tags: [Administration]
      operationId: saveIdentity
      parameters:
        - name: identityId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityRequest'}
      responses:
        '204': {description: Identity saved and authorization version incremented}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
  /iam/admin/profiles/{profileId}:
    get:
      tags: [Management Profiles]
      operationId: getAuthorizationProfile
      parameters:
        - name: profileId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Authorization profile detail including scopes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationProfileResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: Authorization profile not found}
    put:
      tags: [Administration]
      operationId: saveAuthorizationProfile
      parameters:
        - name: profileId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorizationProfileRequest'}
      responses:
        '204': {description: Profile and scopes saved}
        '400': {description: Path and body profile identifiers differ}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
  /iam/admin/profiles/{profileId}/scopes:
    get:
      tags: [Management Profiles]
      operationId: getAuthorizationProfileScopes
      parameters:
        - name: profileId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Resource scopes attached to an authorization profile
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ResourceScope'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: Authorization profile not found}
    put:
      tags: [Administration]
      operationId: replaceAuthorizationProfileScopes
      parameters:
        - name: profileId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScopeReplacementRequest'}
      responses:
        '204': {description: Profile scopes replaced and authorization version incremented}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
  /iam/admin/users/{userId}/authorization-version:
    post:
      tags: [Administration]
      operationId: incrementAuthorizationVersion
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Incremented authorization version
          content:
            application/json:
              schema:
                type: object
                required: [authorizationVersion]
                properties:
                  authorizationVersion: {type: integer, format: int64}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
  /iam/admin/sessions/{sessionId}/revoke:
    post:
      tags: [Administration]
      operationId: forceRevokeSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevokeRequest'}
      responses:
        '204': {description: Session forcibly revoked}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: Active session not found}
  /iam/admin/users/{userId}/sessions/revoke:
    post:
      tags: [Administration]
      operationId: forceRevokeUserSessions
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: integer, format: int64}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RevokeRequest'}
      responses:
        '204': {description: All active sessions for the user forcibly revoked}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
  /iam/auth/capabilities:
    get:
      tags: [Capabilities]
      operationId: getCurrentCapabilities
      summary: Capabilities visible to the current principal
      description: >
        Returns only what the current principal can see: the principal, its active
        profile and template version, the permission codes granted by the active
        template version, and the resource scopes of the active profile. No other
        subject data is returned and no administration permission is required.
      responses:
        '200':
          description: Current principal capabilities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrincipalCapabilitiesResponse'}
        '401': {description: Authentication required}
  /iam/admin/overview:
    get:
      tags: [Management Overview]
      operationId: getAdminOverview
      summary: Operational summary for the IAM administration console
      responses:
        '200':
          description: Operational counts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverviewResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
  /iam/admin/permissions:
    get:
      tags: [Management Permissions]
      operationId: listPermissions
      summary: Permission explorer over the permission registry
      parameters:
        - name: keyword
          in: query
          required: false
          schema: {type: string, maxLength: 191}
          description: Case-insensitive substring filter on permission code or display name.
        - name: domain
          in: query
          required: false
          schema: {type: string, maxLength: 64}
          description: Optional prefix filter applied to the permission code domain segment.
        - name: afterId
          in: query
          required: false
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Cursor-paginated permission registry entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionListResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
  /iam/admin/templates:
    get:
      tags: [Management Templates]
      operationId: listPermissionTemplates
      parameters:
        - name: afterTemplateId
          in: query
          required: false
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Cursor-paginated permission templates with their latest version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionTemplateListResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
    post:
      tags: [Management Templates]
      operationId: createPermissionTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PermissionTemplateCreateRequest'}
      responses:
        '201':
          description: Permission template created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionTemplateSummary'}
        '400': {description: Invalid template data}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
  /iam/admin/templates/{templateId}:
    get:
      tags: [Management Templates]
      operationId: getPermissionTemplate
      parameters:
        - name: templateId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Permission template detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionTemplateSummary'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: Permission template not found}
  /iam/admin/templates/{templateId}/versions:
    get:
      tags: [Management Templates]
      operationId: listPermissionTemplateVersions
      parameters:
        - name: templateId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Versions of a permission template, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PermissionTemplateVersionResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: Permission template not found}
    post:
      tags: [Management Templates]
      operationId: createPermissionTemplateVersion
      parameters:
        - name: templateId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PermissionTemplateVersionCreateRequest'}
      responses:
        '201':
          description: New draft version with a server-assigned version number
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionTemplateVersionResponse'}
        '400': {description: Invalid version data}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: Permission template not found}
  /iam/admin/template-versions/{versionId}:
    get:
      tags: [Management Templates]
      operationId: getPermissionTemplateVersion
      parameters:
        - name: versionId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Permission template version with its permission codes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionTemplateVersionResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: Template version not found}
  /iam/admin/template-versions/{versionId}/publish:
    post:
      tags: [Management Templates]
      operationId: publishPermissionTemplateVersion
      parameters:
        - name: versionId
          in: path
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Draft version published and made immutable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionTemplateVersionResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: Template version not found}
        '409': {description: Version is not a draft}
  /iam/admin/profiles:
    get:
      tags: [Management Profiles]
      operationId: listAuthorizationProfiles
      parameters:
        - name: afterProfileId
          in: query
          required: false
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: userId
          in: query
          required: false
          schema: {type: integer, format: int64}
        - name: templateVersionId
          in: query
          required: false
          schema: {type: integer, format: int64}
        - name: enabled
          in: query
          required: false
          schema: {type: boolean}
        - name: revoked
          in: query
          required: false
          schema: {type: boolean}
        - name: clientType
          in: query
          required: false
          schema: {type: string, maxLength: 64}
      responses:
        '200':
          description: Cursor-paginated authorization profiles
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileListResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
    post:
      tags: [Management Profiles]
      operationId: createAuthorizationProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthorizationProfileCreateRequest'}
      responses:
        '201':
          description: Profile created against a published template version
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthorizationProfileResponse'}
        '400': {description: Invalid profile data or unpublished template version}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: User not found}
  /iam/admin/users/{userId}/profiles:
    get:
      tags: [Management Profiles]
      operationId: listUserAuthorizationProfiles
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Authorization profiles owned by the user
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AuthorizationProfileResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: User not found}
  /iam/admin/sessions:
    get:
      tags: [Management Sessions]
      operationId: adminListSessions
      parameters:
        - name: userId
          in: query
          required: false
          schema: {type: integer, format: int64}
        - name: clientType
          in: query
          required: false
          schema: {type: string, maxLength: 64}
        - name: active
          in: query
          required: false
          schema: {type: boolean}
          description: When true only active sessions are returned; when false only ended sessions.
        - name: after
          in: query
          required: false
          schema: {type: string}
          description: Opaque cursor returned by a previous page. It encodes the last seen login time and session id; it never contains token material.
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Cursor-paginated sessions across users
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSessionListResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
  /iam/admin/sessions/{sessionId}:
    get:
      tags: [Management Sessions]
      operationId: getAdminSession
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Session detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: Session not found}
  /iam/admin/users/{userId}/sessions:
    get:
      tags: [Management Sessions]
      operationId: listUserSessions
      parameters:
        - name: userId
          in: path
          required: true
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Sessions owned by the user
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SessionResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: User not found}
  /iam/admin/audit-events:
    get:
      tags: [Management Audit]
      operationId: listAuditEvents
      parameters:
        - name: userId
          in: query
          required: false
          schema: {type: integer, format: int64}
        - name: identityId
          in: query
          required: false
          schema: {type: string}
        - name: eventType
          in: query
          required: false
          schema: {type: string, maxLength: 191}
        - name: resourceType
          in: query
          required: false
          schema: {type: string, maxLength: 128}
        - name: resourceId
          in: query
          required: false
          schema: {type: string, maxLength: 191}
        - name: sessionId
          in: query
          required: false
          schema: {type: string}
        - name: from
          in: query
          required: false
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: false
          schema: {type: string, format: date-time}
        - name: after
          in: query
          required: false
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Cursor-paginated immutable audit events
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventListResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
  /iam/admin/audit-events/{eventId}:
    get:
      tags: [Management Audit]
      operationId: getAuditEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Audit event detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventResponse'}
        '401': {description: Authentication required}
        '403': {description: Administration permission denied}
        '404': {description: Audit event not found}
components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password, clientType]
      properties:
        username: {type: string, minLength: 1}
        password: {type: string, format: password, minLength: 1, writeOnly: true}
        clientType: {type: string, minLength: 1}
        clientInstance: {type: string, maxLength: 191, nullable: true}
    LoginResponse:
      type: object
      required: [accessToken, sessionId, expiresAt, principal]
      properties:
        accessToken: {type: string}
        sessionId: {type: string}
        expiresAt: {type: string, format: date-time}
        principal: {$ref: '#/components/schemas/PrincipalResponse'}
    PrincipalResponse:
      type: object
      required: [userId, identityId, identityDomain, activeProfileId, templateVersionId, clientType, authorizationVersion]
      properties:
        userId: {type: integer, format: int64}
        identityId: {type: string}
        identityDomain: {type: string}
        activeProfileId: {type: integer, format: int64, minimum: 1}
        templateVersionId: {type: integer, format: int64, minimum: 1}
        clientType: {type: string}
