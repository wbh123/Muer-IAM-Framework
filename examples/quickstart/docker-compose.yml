name: iam-quickstart

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: iam_example
      MYSQL_USER: ${MUER_EXAMPLE_DB_USERNAME:-iam}
      MYSQL_PASSWORD: ${MUER_EXAMPLE_DB_PASSWORD:-iam-secret}
      MYSQL_ROOT_PASSWORD: ${MUER_EXAMPLE_DB_ROOT_PASSWORD:-local-root-secret}
    ports:
      - "127.0.0.1:${MUER_EXAMPLE_DB_PORT:-3306}:3306"
    volumes:
      - iam-quickstart-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u iam -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${MUER_EXAMPLE_REDIS_PORT:-6379}:6379"
    volumes:
      - iam-quickstart-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  iam-quickstart-mysql:
  iam-quickstart-redis:
